spring:
  application:
    name: serverhub

  datasource:
    # 既定値は infra/docker/docker-compose.yml + .env.example のローカル開発用設定に一致。
    # 本番など他環境では SPRING_DATASOURCE_* 環境変数で上書きする（シークレットはコミットしない）。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/serverhub}
    username: ${SPRING_DATASOURCE_USERNAME:serverhub}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 既存 DB へ後から導入するケースに備える（初回は空でも安全に動作する）
    baseline-on-migrate: true

# Doma（doma-spring-boot）
doma:
  # JDBC URL から自動判定されるが、明示して意図を固定する
  dialect: POSTGRES
  # DB は snake_case 命名。エンティティのフィールド名から列名へ自動変換する
  naming: SNAKE_LOWER_CASE
  # Doma の例外を Spring の DataAccessException 系へ変換する
  exception-translation-enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.serverhub: DEBUG
