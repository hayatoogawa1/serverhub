# ServerHub Frontend（nginx）。
# - SPA を静的配信し、未知パスは index.html にフォールバック（React Router）
# - /api は Backend コンテナへリバースプロキシ（SPA と同一オリジン = セッション Cookie / CSRF が素直に動く）
# - セキュリティヘッダは Backend の APP_CSP（04-security D-SEC-01/03）と同等のものを静的レスポンスにも付与

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 埋め込み DNS。Backend が一時的に落ちていても nginx 起動を妨げない（変数 proxy_pass）
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx 自身の死活（オーケストレータ用）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API と actuator/health は Backend へ
    location /api/ {
        set $backend "http://backend:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /actuator/health {
        set $backend "http://backend:8080";
        proxy_pass $backend/actuator/health;
        access_log off;
        proxy_set_header Host $host;
    }

    # ハッシュ付きアセットは長期キャッシュ
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 本体。index.html はキャッシュさせない
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        # 04-security D-SEC-01/03 の APP_CSP と同等（静的レスポンス向け）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
