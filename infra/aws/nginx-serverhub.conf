# ServerHub — EC2 ホスト nginx の server block（非 Docker デプロイ）。
#
# 置き場所: /etc/nginx/conf.d/serverhub.conf
# 役割: フロントの静的ファイル配信 + /api を backend(jar) へリバースプロキシ + TLS 終端。
#   コンテナ版 frontend/nginx.conf と同じ topology（SPA は nginx、backend は静的配信しない。
#   ADR 0004）。
#
# 初回セットアップ（infra/aws/bootstrap.sh / README 参照）:
#   1) __SERVERHUB_DOMAIN__ を実ドメインに置換してこのファイルを配置（80 番のみ）
#   2) certbot --nginx -d <domain> --redirect を実行
#      → certbot が listen 443 ssl / ssl_certificate / 80→443 リダイレクトを追記する
#   3) certbot-renew.timer で自動更新
#
# 更新デプロイ（deploy.sh）はこのファイルを touch しない。ルーティングを変えたい時だけ
# 手で更新して nginx -t && systemctl reload nginx。

server {
    listen 80;
    listen [::]:80;
    server_name __SERVERHUB_DOMAIN__;

    # フロントの静的ファイル（deploy.sh が dist/ をここへ配置）
    root /var/www/serverhub;
    index index.html;

    # ACME HTTP-01 チャレンジ（certbot --webroot / 更新時）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/serverhub;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    # nginx 自身の死活
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API と actuator/health は backend(jar) へ。jar は 127.0.0.1:8080 のみで listen。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # TLS 終端はこの nginx。backend は forward-headers-strategy=framework でこれを信頼する
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        access_log off;
        proxy_set_header Host $host;
    }

    # ハッシュ付きアセットは長期キャッシュ
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 本体。index.html はキャッシュさせない
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        # 04-security D-SEC-01/03 の APP_CSP と同等（静的レスポンス向け）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # certbot --nginx がこの下に listen 443 ssl { ... } と 80→443 リダイレクトを追記する
}
