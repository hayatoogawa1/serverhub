spring:
  application:
    name: serverhub

  datasource:
    # 既定値はローカル Docker（infra/docker/docker-compose.yml + .env.example）に一致。
    # Neon やその他の環境では SPRING_DATASOURCE_* 環境変数で上書きする
    # （Neon は SPRING_PROFILES_ACTIVE=neon も設定。application-neon.yml / docs/adr/0003）。
    # シークレットはコミットしない（.env は Git 管理外）。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/serverhub}
    username: ${SPRING_DATASOURCE_USERNAME:serverhub}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 既存 DB へ後から導入するケースに備える（初回は空でも安全に動作する）
    baseline-on-migrate: true

# Doma（doma-spring-boot）
doma:
  # JDBC URL から自動判定されるが、明示して意図を固定する
  dialect: POSTGRES
  # DB は snake_case 命名。エンティティのフィールド名から列名へ自動変換する
  naming: SNAKE_LOWER_CASE
  # Doma の例外を Spring の DataAccessException 系へ変換する
  exception-translation-enabled: true

server:
  servlet:
    session:
      # アイドルタイムアウト 30 分（open-issues S4 / requirements §10.1.3）。
      # 「最後の API リクエストから 30 分リクエストが無ければセッション無効化・再ログイン要求」。
      # Tomcat 既定と同値だが、確定仕様として明示する。
      timeout: 30m

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# AWS EC2 実行状態の参照（FR-CLOUD-01、07-aws-ec2-integration §6.4）。
# 既定は無効。ローカル・CI は false のまま（AWS を一切呼ばない）。
# 本番で有効化するときは SERVERHUB_CLOUD_ENABLED=true + IAM ロール（静的キーは持たない、§8）。
serverhub:
  cloud:
    enabled: ${SERVERHUB_CLOUD_ENABLED:false}
    poll-interval: ${SERVERHUB_CLOUD_POLL_INTERVAL:PT1M}
    staleness-threshold: ${SERVERHUB_CLOUD_STALENESS_THRESHOLD:PT5M}
    aws:
      region: ${SERVERHUB_CLOUD_AWS_REGION:ap-northeast-1}
      batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    # 開発時の詳細（本番プロファイルで INFO へ抑制する予定、requirements §12.6）
    com.serverhub: DEBUG
  structured:
    format:
      # 構造化ログ（JSON）を標準出力へ。Spring Boot 標準の Structured Logging を使い
      # 専用ライブラリ・logback-spring.xml を足さない（基本設計 05-cross-cutting D-XCUT-06 / D-XCUT-09）。
      # traceId は MDC 経由で各行に自動付与される（RequestLoggingFilter）。
      # service.name は spring.application.name（= serverhub）が自動で入る。
      # ローカルで素のテキストが見たい場合は LOGGING_STRUCTURED_FORMAT_CONSOLE= で無効化できる。
      console: ecs
